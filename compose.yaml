services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres@db:5432/postgres
      ENVIRONMENT: development
      DEMO_MODE: "true"
      DEMO_SEED: "true"
      MAX_UPDATE_MODE: ${MAX_UPDATE_MODE:-webhook}
      CORS_ORIGINS: https://compute-vm-2-4-30-ssd-1790500105520.taile1d37a.ts.net,http://localhost:8080,http://localhost:5173
    command: ["python", "-m", "app.web.start"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres@db:5432/postgres
      ENVIRONMENT: development
      DEMO_MODE: "true"
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot:
    profiles: ["max-long-polling"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres@db:5432/postgres
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAX_UPDATE_MODE: ${MAX_UPDATE_MODE:-webhook}
    command: ["python", "-m", "app.main"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
